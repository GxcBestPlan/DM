server:
  port: 8080

spring:
  application:
    name: dm-backend
  datasource:
    url: jdbc:mysql://localhost:3306/dm?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: dm
    password: Dm123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

dm:
  jwt:
    # 开发默认值；生产部署请改环境变量覆盖
    secret: dm-dev-secret-key-please-change-in-production-0123456789
    expire-hours: 12
